name: Schedule Diagnostic

on:
  schedule:
    # Minimal diagnostic: every 5 minutes, staggered away from :00.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger info
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "jst=$(TZ=Asia/Tokyo date +'%Y-%m-%dT%H:%M:%S%z')"
          echo "schedule diagnostic OK"
